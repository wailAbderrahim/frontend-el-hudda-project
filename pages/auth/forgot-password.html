<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>استعادة كلمة المرور | الهدى للقرآن</title>
    <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpg" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">

    <main class="w-full max-w-md">

        <!-- Brand -->

        <div class="text-center mb-8">

            <a href="../../index.html" class="inline-block transition hover:opacity-95 focus:outline-none">
                <img
                    src="../../assets/images/logo.jpg"
                    alt="شعار مدرسة الهدى للقرآن"
                    class="mx-auto mb-4 h-24 w-24 rounded-2xl object-contain shadow-md shadow-emerald-900/10 ring-1 ring-slate-200/60"
                />
            </a>

            <h1 class="text-2xl font-bold text-slate-800">
                الهدى للقرآن
            </h1>

            <p class="text-sm text-slate-500 mt-2">
                استعادة كلمة المرور
            </p>

        </div>


        <!-- Card -->

        <section
            class="bg-white rounded-2xl shadow-xl
                   shadow-slate-200/60
                   border border-slate-200
                   p-6 sm:p-8"
        >

            <div class="text-center mb-6">

                <h2 class="text-xl font-bold text-slate-800">
                    نسيت كلمة المرور؟
                </h2>

                <p class="text-sm text-slate-500 mt-2 leading-6">
                    أدخل بريدك الإلكتروني وسنرسل لك رابطًا
                    لإعادة تعيين كلمة المرور.
                </p>

            </div>


            <!-- Form -->

            <form id="forgot-password-form" class="space-y-5">

                <div>

                    <label
                        for="email"
                        class="block text-sm font-medium
                               text-slate-700 mb-2"
                    >
                        البريد الإلكتروني
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        placeholder="example@email.com"
                        class="w-full rounded-xl border
                               border-slate-300
                               bg-white px-4 py-3
                               text-sm text-slate-800
                               outline-none
                               transition
                               focus:border-emerald-500
                               focus:ring-2
                               focus:ring-emerald-500/20"
                    >

                </div>


                <!-- Error -->

                <p
                    id="forgot-error"
                    class="hidden text-sm text-red-600
                           bg-red-50 border border-red-100
                           rounded-lg px-4 py-3"
                ></p>


                <!-- Success -->

                <p
                    id="forgot-success"
                    class="hidden text-sm text-emerald-700
                           bg-emerald-50 border border-emerald-100
                           rounded-lg px-4 py-3"
                ></p>


                <!-- Submit -->

                <button
                    type="submit"
                    id="forgot-submit"
                    class="w-full rounded-xl
                           bg-emerald-600
                           px-5 py-3
                           text-sm font-semibold text-white
                           transition
                           hover:bg-emerald-700
                           focus:outline-none
                           focus:ring-2
                           focus:ring-emerald-500
                           focus:ring-offset-2
                           disabled:opacity-60
                           disabled:cursor-not-allowed"
                >
                    إرسال رابط الاستعادة
                </button>

            </form>


            <!-- Back to Login -->

            <div class="mt-6 text-center">

                <a
                    href="./login.html"
                    class="text-sm font-medium
                           text-emerald-600
                           hover:text-emerald-700"
                >
                    العودة إلى تسجيل الدخول
                </a>

            </div>

        </section>


        <!-- Footer -->

        <p class="text-center text-xs text-slate-400 mt-6">
            © 2026 الهدى للقرآن — جميع الحقوق محفوظة
        </p>

    </main>


    <script
        type="module"
        src="../../js/pages/auth/forgot-password.js"
    ></script>

</body>

</html>
