<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>تسجيل الدخول | الهدى للقرآن</title>
</head>

<body class="min-h-screen bg-slate-50">

    <main class="min-h-screen flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-md">

            <!-- Logo / Brand -->
            <div class="text-center mb-8">

                <div
                    class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-700 text-white shadow-lg shadow-emerald-700/20">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-8 w-8"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="1.7"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5S19.832 5.477 21 6.253v13C19.832 18.477 18.246 18 16.5 18s-3.332.477-4.5 1.253"
                        />
                    </svg>
                </div>

                <h1 class="text-3xl font-bold text-slate-800">
                    الهدى للقرآن
                </h1>

                <p class="mt-2 text-sm text-slate-500">
                    الموقع الرسمي لمدرسة الهدى القراّنية
                </p>

            </div>


            <!-- Login Card -->
            <div
                class="rounded-2xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/50 sm:p-8"
            >

                <div class="mb-7">
                    <h2 class="text-xl font-bold text-slate-800">
                        تسجيل الدخول
                    </h2>

                    <p class="mt-1 text-sm text-slate-500">
                        أدخل بيانات حسابك للمتابعة
                    </p>
                </div>


                <!-- Error Message -->
                <div
                    id="login-error"
                    class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
                ></div>


                <form id="login-form" class="space-y-5">

                    <!-- Email -->
                    <div>

                        <label
                            for="email"
                            class="mb-2 block text-sm font-medium text-slate-700"
                        >
                            البريد الإلكتروني
                        </label>

                        <div class="relative">

                            <span
                                class="pointer-events-none absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="h-5 w-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M3 8l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                                    />
                                </svg>
                            </span>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="أدخل بريدك الإلكتروني"
                                autocomplete="email"
                                required
                                class="w-full rounded-xl border border-slate-200 bg-slate-50 py-3 pr-11 pl-4 text-sm text-slate-800 outline-none transition focus:border-emerald-600 focus:bg-white focus:ring-4 focus:ring-emerald-600/10"
                            >

                        </div>

                    </div>


                    <!-- Password -->
                    <div>

                        <label
                            for="password"
                            class="mb-2 block text-sm font-medium text-slate-700"
                        >
                            كلمة المرور
                        </label>

                        <div class="relative">

                            <span
                                class="pointer-events-none absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="h-5 w-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M16.5 10.5V8a4.5 4.5 0 00-9 0v2.5M6 10.5h12a2 2 0 012 2v6a2 2 0 01-2 2H6a2 2 0 01-2-2v-6a2 2 0 012-2z"
                                    />
                                </svg>
                            </span>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="أدخل كلمة المرور"
                                autocomplete="current-password"
                                required
                                class="w-full rounded-xl border border-slate-200 bg-slate-50 py-3 pr-11 pl-4 text-sm text-slate-800 outline-none transition focus:border-emerald-600 focus:bg-white focus:ring-4 focus:ring-emerald-600/10"
                            >

                        </div>

                    </div>


                    <!-- Forgot Password -->
                    <div class="flex justify-start">

                        <a
                            href="./forgot-password.html"
                            class="text-sm font-medium text-emerald-700 transition hover:text-emerald-800 hover:underline"
                        >
                            نسيت كلمة المرور؟
                        </a>

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="w-full rounded-xl bg-emerald-700 px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-emerald-700/20 transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-700/20 active:scale-[0.99]"
                    >
                        تسجيل الدخول
                    </button>

                </form>


                <!-- Register -->
                <div class="mt-7 border-t border-slate-100 pt-6 text-center">

                    <p class="text-sm text-slate-500">
                        ما عندكش حساب؟

                        <a
                            href="./register.html"
                            class="mr-1 font-bold text-emerald-700 hover:text-emerald-800 hover:underline"
                        >
                            إنشاء حساب
                        </a>
                    </p>

                </div>

            </div>


            <!-- Footer -->
            <p class="mt-6 text-center text-xs text-slate-400">
                الهدى للقرآن — نظام إدارة المدرسة القرآنية
            </p>

        </div>

    </main>


    <script type="module" src="../../js/pages/auth/login.js"></script>

</body>

</html>
