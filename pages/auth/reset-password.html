<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>إعادة تعيين كلمة المرور | الهدى للقرآن</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">

    <main class="w-full max-w-md">

        <!-- Brand -->

        <div class="text-center mb-8">

            <div
                class="mx-auto mb-4 w-16 h-16 rounded-2xl
                       bg-emerald-600 text-white
                       flex items-center justify-center
                       shadow-lg shadow-emerald-600/20"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-8 h-8"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v2h8z"
                    />
                </svg>

            </div>

            <h1 class="text-2xl font-bold text-slate-800">
                الهدى للقرآن
            </h1>

            <p class="text-sm text-slate-500 mt-2">
                إعادة تعيين كلمة المرور
            </p>

        </div>


        <!-- Card -->

        <section
            class="bg-white rounded-2xl shadow-xl
                   shadow-slate-200/60
                   border border-slate-200
                   p-6 sm:p-8"
        >

            <div class="text-center mb-6">

                <h2 class="text-xl font-bold text-slate-800">
                    اختر كلمة مرور جديدة
                </h2>

                <p class="text-sm text-slate-500 mt-2 leading-6">
                    أدخل كلمة المرور الجديدة ثم أكدها.
                </p>

            </div>


            <form id="reset-password-form" class="space-y-5">

                <!-- New Password -->

                <div>

                    <label
                        for="new-password"
                        class="block text-sm font-medium
                               text-slate-700 mb-2"
                    >
                        كلمة المرور الجديدة
                    </label>

                    <input
                        id="new-password"
                        name="newPassword"
                        type="password"
                        autocomplete="new-password"
                        required
                        placeholder="أدخل كلمة المرور الجديدة"
                        class="w-full rounded-xl border
                               border-slate-300
                               bg-white px-4 py-3
                               text-sm text-slate-800
                               outline-none transition
                               focus:border-emerald-500
                               focus:ring-2
                               focus:ring-emerald-500/20"
                    >

                </div>


                <!-- Confirm Password -->

                <div>

                    <label
                        for="confirm-password"
                        class="block text-sm font-medium
                               text-slate-700 mb-2"
                    >
                        تأكيد كلمة المرور
                    </label>

                    <input
                        id="confirm-password"
                        name="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        required
                        placeholder="أعد إدخال كلمة المرور"
                        class="w-full rounded-xl border
                               border-slate-300
                               bg-white px-4 py-3
                               text-sm text-slate-800
                               outline-none transition
                               focus:border-emerald-500
                               focus:ring-2
                               focus:ring-emerald-500/20"
                    >

                </div>


                <!-- Error -->

                <p
                    id="reset-error"
                    class="hidden text-sm text-red-600
                           bg-red-50 border border-red-100
                           rounded-lg px-4 py-3"
                ></p>


                <!-- Success -->

                <p
                    id="reset-success"
                    class="hidden text-sm text-emerald-700
                           bg-emerald-50 border border-emerald-100
                           rounded-lg px-4 py-3"
                ></p>


                <!-- Submit -->

                <button
                    type="submit"
                    id="reset-submit"
                    class="w-full rounded-xl
                           bg-emerald-600
                           px-5 py-3
                           text-sm font-semibold text-white
                           transition hover:bg-emerald-700
                           focus:outline-none
                           focus:ring-2
                           focus:ring-emerald-500
                           focus:ring-offset-2
                           disabled:opacity-60
                           disabled:cursor-not-allowed"
                >
                    تغيير كلمة المرور
                </button>

            </form>


            <div class="mt-6 text-center">

                <a
                    href="./login.html"
                    class="text-sm font-medium
                           text-emerald-600
                           hover:text-emerald-700"
                >
                    العودة إلى تسجيل الدخول
                </a>

            </div>

        </section>


        <p class="text-center text-xs text-slate-400 mt-6">
            © 2026 الهدى للقرآن — جميع الحقوق محفوظة
        </p>

    </main>


    <script
        type="module"
        src="../../js/pages/auth/reset-password.js"
    ></script>

</body>

</html>
